# RISC-V QEMU virt port (local, not upstream). Mirrors qemu_cortex_m3.conf:
# CI tests require telnet shell
CONFIG_SHELL_BACKEND_TELNET=y
CONFIG_SHELL_TELNET_SUPPORT_COMMAND=y
CONFIG_APP_NTP=n
CONFIG_RTC=n
CONFIG_APP_CONSOLE_LOGGER=n
CONFIG_REDFISH=n
CONFIG_APP_WEB=n
CONFIG_APP_WEB_TERMINAL=n
CONFIG_PERSISTENT_STORAGE=n
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TEST_CSPRNG_GENERATOR=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_SHELL=y
CONFIG_CONSOLE_BRIDGE=n

# Use the virtio-net Ethernet driver instead of Zephyr's default QEMU
# SLIP-over-UART networking. The test harness runs QEMU itself with
# -netdev user + virtio-net-device; see the overlay.
CONFIG_NET_QEMU_USER=y
CONFIG_NET_L2_ETHERNET=y

# QEMU virt has no flash; the image runs from RAM
CONFIG_USE_DT_CODE_PARTITION=n

# Emulated GPIO controller from the overlay (power/LED aliases)
CONFIG_GPIO_EMUL=y

# Upstream hardcodes 256 B (fine on Cortex-M); measured peak with the thread
# analyzer is 328 B on RV32 and 460 B on RV64, so 256 overflows.
CONFIG_APP_LED_BLINK_STACK_SIZE=1024

# Measured with the thread analyzer during a telnet session
# (scripts/test-wallabmc.sh). sysworkq peaks at 988/1024 B (96%).
# shell_telnet (sized by SHELL_STACK_SIZE, 2048 B default on RV32) peaks at
# 1884 B (91%). Phase 3 raised both to 3072/2048 B; Phase 4 raised them
# again, see SYSTEM_WORKQUEUE_STACK_SIZE / SHELL_STACK_SIZE at the end.

# Zephyr's RV32 default is 1024 B (RV64: 4096). With REDFISH on, main()
# computes the BMC UUIDv5 (PSA SHA-1) in vpd_init() and the stack sentinel
# fires before the banner is even printed. Match RV64.
CONFIG_MAIN_STACK_SIZE=4096

# Phase 4 (APP_HTTPS): the TLS 1.3 handshake (mbedtls_ssl_handshake_step ->
# ssl_tls13_write_encrypted_extensions) peaks http_server_tid at 4132 B on
# RV64 (stack sentinel fires with upstream's 4096) and 3612 B on RV32 (88%;
# RV32 hung silently at 4096)
CONFIG_HTTP_SERVER_STACK_SIZE=6144

# Phase 4 (APP_WEB_TERMINAL, websocket shell + log backend over HTTP/HTTPS),
# both boards: sysworkq overflowed 2048 B on RV64 (sentinel fired in
# tcp_send_queued_data -> k_work_reschedule; upstream already raises it to
# 2560 for HTTPS+websocket on Cortex-M), and the wss shell thread
# (shell_websocket_https_service, sized by SHELL_STACK_SIZE like every shell
# backend) overflowed 3072 B on RV64; RV32 measured 2776/3072 B (90%).
# Re-measured with these sizes: RV64 wss shell 3628 B, sysworkq 2420 B.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=6144
