# Websocket BMC shell (/console/bmc on both HTTP and HTTPS) + websocket log
# backend. The host-serial websocket (/console/host) needs a second UART
# (DT alias host-console-uart) with the async API; QEMU virt has only the one
# ns16550, which is the BMC's own console, so it stays off.
CONFIG_APP_WEB_TERMINAL=y
CONFIG_APP_WEB_TERMINAL_BMC_SHELL=y
CONFIG_APP_WEB_TERMINAL_HOST_SERIAL=n
